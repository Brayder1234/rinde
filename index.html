<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rinde</title>
<meta name="description" content="Rinde: controla tus gastos escribiendo como en un chat. Presupuestos, metas y 100 % privado.">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rinde">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script>
  // Tema antes de pintar, para evitar el destello blanco en modo oscuro.
  try {
    const t = (JSON.parse(localStorage.getItem('rinde.v1') || '{}').settings || {}).theme || 'auto';
    if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav id="tabbar" hidden></nav>
</div>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Rinde necesita JavaScript para funcionar.</p></noscript>
<script type="module" src="js/app.js"></script>
<script>
  // Si el navegador es muy antiguo y el módulo no carga, avisar.
  setTimeout(function () {
    if (!document.getElementById('main').innerHTML.trim()) {
      document.getElementById('main').innerHTML = '<p style="padding:32px 8px">Rinde necesita iOS 16.4 o superior (o un navegador actualizado).</p>';
    }
  }, 4000);
</script>
</body>
</html>
